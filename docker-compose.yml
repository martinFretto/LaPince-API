services:
  node_api:
    container_name: node_api
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules #volume anonyme qui protège le dossier installé par la commande npm i du Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=abcde123456
    depends_on:
      lapince_db: 
        condition: service_healthy

  lapince_db:
    image: postgres:latest
    container_name: lapince_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_NAME}
    volumes:
      - ./data:/docker-entrypoint-initdb.d
      - pg_data_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_volume: